name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Chạy trên cả Windows lẫn Linux vì bộ script này đụng đúng chỗ hai hệ khác
    # nhau: dấu phân cách đường dẫn, và kiểu xuống dòng CRLF/LF. Một trong hai
    # thứ đó sai là mọi phép so với host thành vô nghĩa — nên nó phải nằm trong CI,
    # không phải "để ý khi nhớ".
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Mọi script phải biên dịch được
        shell: bash
        run: |
          set -e
          find skills -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
          python -m py_compile tests/chay_test.py

      - name: Bộ test fixture
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/chay_test.py

      - name: Không được lọt dữ liệu riêng vào repo công khai
        shell: bash
        run: python tests/kiem_rieng_tu.py
