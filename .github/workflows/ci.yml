name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # Chạy trên cả Windows lẫn Linux vì bộ script này đụng đúng chỗ hai hệ khác
    # nhau: dấu phân cách đường dẫn, kiểu xuống dòng CRLF/LF, và encoding console.
    # Cả ba thứ đó đã từng làm hỏng thật, nên chúng phải nằm trong CI chứ không
    # phải "để ý khi nhớ" — lần chạy CI đầu tiên đỏ đúng vì console Windows cp1252.
    name: unit · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Mọi script phải biên dịch được
        shell: bash
        run: |
          set -e
          find skills tests -name '*.py' -print0 | xargs -0 -n1 python -m py_compile

      - name: Bộ test fixture
        shell: bash
        run: python tests/chay_test.py

      - name: Không được lọt dữ liệu riêng vào repo công khai
        shell: bash
        run: python tests/kiem_rieng_tu.py

      # wp-preview-builder: ghim CÔNG THỨC đo tràn ngang, không cần trình duyệt.
      #
      # Ranh giới phải nói rõ: bước này KHÔNG chứng minh probe chạy đúng trong một trang
      # thật. Nó chứng minh công thức là công thức đúng, và chặn việc lặng lẽ quay về
      # `innerWidth` — thứ đã từng trả về 0 trên một trang tràn 296px. CI không có trình
      # duyệt nên phần quyết định được tách sang Python và ghim bằng số của ca hỏng thật.
      - name: wp-preview-builder — công thức tràn ngang đã hiệu chuẩn
        shell: bash
        run: python tests/test_preview.py

      # code-optimize: backup toàn cây + phục hồi phải CHẠY THẬT, không chỉ được mô tả.
      # Ca quyết định: xoá hẳn cây nguồn, phục hồi chỉ từ backup, so byte với bản gốc
      # giữ riêng — đó là tình huống thật của một đường lùi.
      - name: code-optimize — diễn tập backup/phục hồi
        shell: bash
        run: python tests/test_sao_luu.py

      # code-optimize: cổng clean fail-closed, hai chiều + ca đối chứng ngược.
      - name: code-optimize — cổng clean
        shell: bash
        run: python tests/test_cong_clean.py

  integration:
    # Tầng mà fixture tĩnh KHÔNG thay được: dựng WordPress + WooCommerce thật rồi
    # hỏi chính nó file nào được nạp và class nào được render, sau đó so với kết
    # luận của bộ quét. Dùng SQLite drop-in nên không cần MySQL, không cần Docker.
    name: integration · WordPress + WooCommerce
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, zip, gd
          coverage: none

      - name: Cache bản tải WordPress/WooCommerce
        uses: actions/cache@v4
        with:
          path: .wp-it/tai
          key: wp-it-tai-${{ runner.os }}-v1

      - name: Dựng WordPress + WooCommerce
        run: python tests/integration/dung_wp.py --ra .wp-it

      - name: So kết luận của bộ quét với sự thật từ WordPress
        run: python tests/integration/test_integration.py --ra .wp-it

      # Tầng 5 — thước cho phép BIẾN ĐỔI, không phải cho phép xoá.
      #
      # Bước này là một phép HIỆU CHUẨN, không phải một phép kiểm tính năng: nó tiêm
      # sáu lỗi refactor thật vào một theme fixture rồi đòi thước phải ĐỎ đúng chỗ ở
      # từng ca. Nó cũng chụp bản không đổi hai lượt trước và thoát khác 0 nếu hai lượt
      # đã lệch — baseline không ổn định thì mọi kết quả "bắt được" đều vô nghĩa.
      #
      # Nếu bước này đỏ thì đừng nới thước cho nó xanh: hoặc một mặt đo vừa mất khả
      # năng bắt lỗi, hoặc baseline vừa mất tính tất định. Cả hai đều là tin tốt khi
      # phát hiện ở CI, và là tin rất xấu khi phát hiện trên site của khách.
      - name: Tầng 5 — hiệu chuẩn thước tương đương hành vi (6 ca tiêm)
        run: python tests/integration/tang5.py --ra .wp-it

      # Cổng graph — đối chứng đồ thị TĨNH với ADN runtime, hai chiều.
      #
      # Phép kiểm mạnh nhất trong bước này không phải "cổng báo 2 vùng mù" mà là CA ĐỐI
      # CHỨNG NGƯỢC: gỡ đúng file sinh ra hai cạnh động rồi đòi cổng về 0. Báo đúng số
      # mà không biết số đó từ đâu ra thì vẫn có thể là trùng hợp.
      - name: Cổng graph — bắt được vùng mù của phân tích tĩnh
        run: python tests/integration/test_cong_graph.py --ra .wp-it
